[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "totalstation-gpkg"
version = "0.1.0"
description = "Validation and GeoPackage export for total station survey points"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
totalstation-gpkg = "totalstation_gpkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
